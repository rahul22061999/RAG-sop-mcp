name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check server/ tests/

      - name: Run tests
        run: |
          set +e
          uv run pytest
          code=$?
          set -e
          # pytest exits 5 when zero tests are collected - treat that as a
          # pass rather than a failure while test coverage is still being
          # built out, instead of a false-red CI on every push.
          if [ "$code" -eq 5 ]; then
            echo "::warning::No tests collected yet."
            exit 0
          fi
          exit "$code"
